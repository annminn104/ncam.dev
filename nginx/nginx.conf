# Production reverse proxy for the ncam micro-frontend stack.
#
# One nginx fronts the SSR host and each remote, each on its own hostname, so a
# browser reaches every app on a single origin per app. The host's server cannot
# use those URLs for SSR: @module-federation/vite fetches SSR entries over plain
# http from loopback hosts only, so a host built with the gateway URLs below
# mounts its remotes on the client.
#
# Usage (add a gateway service on the app's docker network):
#   gateway:
#     image: nginx:1.27-alpine
#     volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
#     ports: ["80:80"]
#     depends_on: [portfolio, toonhub, mindloop, immersive-ocean, viktor, bali, profile, holodex]
# Then build the host with gateway URLs (no port), e.g. in .env.local:
#   TOONHUB_REMOTE_URL=http://toonhub.localhost/remoteEntry.js
#   MINDLOOP_REMOTE_URL=http://mindloop.localhost/remoteEntry.js
#   IMMERSIVE_OCEAN_REMOTE_URL=http://immersive-ocean.localhost/remoteEntry.js
#   VIKTOR_REMOTE_URL=http://viktor.localhost/remoteEntry.js
#   BALI_REMOTE_URL=http://bali.localhost/remoteEntry.js
#   PROFILE_REMOTE_URL=http://profile.localhost/remoteEntry.js
#   HOLODEX_REMOTE_URL=http://holodex.localhost/remoteEntry.js
# The CMS is proxied on http://cms.localhost (set PUBLIC_URL in apps/strapi/.env to match).
# In production, swap the *.localhost server_names for real sub-domains.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  # Immutable, long-cache for hashed assets; everything else stays fresh.
  map $uri $asset_cache {
    default "no-cache";
    "~*/assets/" "public, max-age=31536000, immutable";
  }

  # The remotes run in the portfolio container's network namespace
  # (docker-compose), so every app answers on the portfolio service's address.
  upstream portfolio {
    server portfolio:9000;
  }
  upstream toonhub {
    server portfolio:9001;
  }
  upstream mindloop {
    server portfolio:9002;
  }
  upstream immersive_ocean {
    server portfolio:9003;
  }
  upstream viktor {
    server portfolio:9004;
  }
  upstream bali {
    server portfolio:9005;
  }
  upstream profile {
    server portfolio:9006;
  }
  upstream holodex {
    server portfolio:9007;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ── SSR host ────────────────────────────────────────────────
  server {
    listen 80 default_server;
    server_name localhost ncam.localhost;

    location / {
      proxy_pass http://portfolio;
    }
  }

  # ── Remotes (static). Module Federation loads them cross-origin, and each
  # remote's preview server already sends Access-Control-Allow-Origin, so these
  # blocks add none: a second one makes browsers refuse the response. They swap
  # the preview's own Cache-Control for $asset_cache instead of adding a second. ──
  server {
    listen 80;
    server_name toonhub.localhost;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $asset_cache always;
    location / {
      proxy_pass http://toonhub;
    }
  }

  server {
    listen 80;
    server_name mindloop.localhost;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $asset_cache always;
    location / {
      proxy_pass http://mindloop;
    }
  }

  server {
    listen 80;
    server_name immersive-ocean.localhost;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $asset_cache always;
    location / {
      proxy_pass http://immersive_ocean;
    }
  }

  server {
    listen 80;
    server_name viktor.localhost;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $asset_cache always;
    location / {
      proxy_pass http://viktor;
    }
  }

  server {
    listen 80;
    server_name bali.localhost;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $asset_cache always;
    location / {
      proxy_pass http://bali;
    }
  }

  server {
    listen 80;
    server_name profile.localhost;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $asset_cache always;
    location / {
      proxy_pass http://profile;
    }
  }

  # Holodex's texture proxy (/api/tcgdex-asset) sends its own CORS and cache
  # headers, which pass through untouched.
  server {
    listen 80;
    server_name holodex.localhost;
    location / {
      proxy_hide_header Cache-Control;
      add_header Cache-Control $asset_cache always;
      proxy_pass http://holodex;
    }
    location /api/ {
      proxy_pass http://holodex;
    }
  }

  # ── CMS (Strapi). Resolved at request time (Docker DNS) instead of a static
  # `upstream`, so the gateway still starts when the strapi container is down. ──
  server {
    listen 80;
    server_name cms.localhost;
    client_max_body_size 25m; # media uploads through the admin
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $strapi_upstream http://strapi:1337;
    location / {
      proxy_pass $strapi_upstream;
    }
  }
}
