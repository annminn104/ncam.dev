<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Đêm mưa · Góc phố Circle K</title>
<style>
:root{--fg:#f4efe6;--dim:rgba(244,239,230,.55);--red:#e3241b;--org:#f7941d}
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:var(--fg);
  font:13px/1.45 -apple-system,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#hud{position:fixed;left:18px;top:16px;pointer-events:none;text-shadow:0 1px 8px #000;transition:opacity .4s}
#hud h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.04em}
#hud h1 b{color:var(--red)}#hud h1 i{font-style:normal;color:var(--org)}
#hud p{margin:2px 0 0;color:var(--dim);font-size:11.5px}
#help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:var(--dim);font-size:11.5px;
  white-space:nowrap;pointer-events:none;text-shadow:0 1px 6px #000;transition:opacity .4s}
#panel{position:fixed;right:14px;top:14px;background:rgba(10,12,18,.62);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;
  min-width:178px;transition:opacity .4s}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:3px 0;font-size:12px;color:#d9d3c8}
#panel input[type=range]{width:92px;accent-color:var(--red)}
#panel input[type=checkbox]{accent-color:var(--red)}
#panel .t{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;display:flex;justify-content:space-between}
#fps{font-variant-numeric:tabular-nums}
.hide #hud,.hide #help,.hide #panel{opacity:0;pointer-events:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fbb}
@media (max-width:640px){#help{white-space:normal;width:calc(100% - 32px);text-align:center}#panel{top:auto;bottom:52px;right:16px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><h1><b>CIRCLE</b> <i>K</i> · Góc phố đêm mưa</h1><p>Mô hình thu nhỏ · WebGL2 · PBR · SSAO · Bloom · ACES</p></div>
<div id="panel">
  <div class="t"><span>Thiết lập</span><span id="fps">-- fps</span></div>
  <label>Mưa <input id="uiRain" type="range" min="0" max="1.5" step="0.01" value="1"></label>
  <label>Phơi sáng <input id="uiExp" type="range" min="0.3" max="2.5" step="0.01" value="1.25"></label>
  <label>Sương mù <input id="uiFog" type="range" min="0" max="2.5" step="0.01" value="0.35"></label>
  <label>Bloom <input id="uiBloom" type="range" min="0" max="2" step="0.01" value="1"></label>
  <label>SSAO <input id="uiAO" type="checkbox" checked></label>
  <label>Xe chạy <input id="uiBike" type="checkbox" checked></label>
  <label>Tự xoay (C) <input id="uiCruise" type="checkbox"></label>
</div>
<div id="help"><b style="color:#fff">Nhấp cửa kính để mở cửa tự động (O)</b> · Kéo: xoay · Shift/chuột phải: di chuyển · Cuộn: zoom · Nhấp đúp: đặt lại · C: tự xoay · H: ẩn giao diện</div>
<div id="err"></div>
<script>
'use strict';

// ================= Math (column-major 4x4) =================
const M4={
  ident(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m},
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o},
  persp(fy,asp,n,f){const t=1/Math.tan(fy/2),nf=1/(n-f),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)*nf;m[11]=-1;m[14]=2*f*n*nf;return m},
  lookAt(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
    let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
    const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
    return new Float32Array([xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1])},
  inv(m){const a=m,o=new Float32Array(16);
    const b00=a[0]*a[5]-a[1]*a[4],b01=a[0]*a[6]-a[2]*a[4],b02=a[0]*a[7]-a[3]*a[4],b03=a[1]*a[6]-a[2]*a[5],b04=a[1]*a[7]-a[3]*a[5],b05=a[2]*a[7]-a[3]*a[6],
      b06=a[8]*a[13]-a[9]*a[12],b07=a[8]*a[14]-a[10]*a[12],b08=a[8]*a[15]-a[11]*a[12],b09=a[9]*a[14]-a[10]*a[13],b10=a[9]*a[15]-a[11]*a[13],b11=a[10]*a[15]-a[11]*a[14];
    let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!d)return M4.ident();d=1/d;
    o[0]=(a[5]*b11-a[6]*b10+a[7]*b09)*d;o[1]=(a[2]*b10-a[1]*b11-a[3]*b09)*d;o[2]=(a[13]*b05-a[14]*b04+a[15]*b03)*d;o[3]=(a[10]*b04-a[9]*b05-a[11]*b03)*d;
    o[4]=(a[6]*b08-a[4]*b11-a[7]*b07)*d;o[5]=(a[0]*b11-a[2]*b08+a[3]*b07)*d;o[6]=(a[14]*b02-a[12]*b05-a[15]*b01)*d;o[7]=(a[8]*b05-a[10]*b02+a[11]*b01)*d;
    o[8]=(a[4]*b10-a[5]*b08+a[7]*b06)*d;o[9]=(a[1]*b08-a[0]*b10-a[3]*b06)*d;o[10]=(a[12]*b04-a[13]*b02+a[15]*b00)*d;o[11]=(a[9]*b02-a[8]*b04-a[11]*b00)*d;
    o[12]=(a[5]*b07-a[4]*b09-a[6]*b06)*d;o[13]=(a[0]*b09-a[1]*b07+a[2]*b06)*d;o[14]=(a[13]*b01-a[12]*b03-a[14]*b00)*d;o[15]=(a[8]*b03-a[9]*b01+a[10]*b00)*d;return o},
  trans(x,y,z){const m=M4.ident();m[12]=x;m[13]=y;m[14]=z;return m},
  rotY(a){const m=M4.ident(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m},
  rotX(a){const m=M4.ident(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m},
  rotZ(a){const m=M4.ident(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m},
  scale(x,y,z){const m=M4.ident();m[0]=x;m[5]=y;m[10]=z;return m},
  // mirror about plane y=h
  mirrorY(h){const m=M4.ident();m[5]=-1;m[13]=2*h;return m},
  xf(m,p){return[m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]]},
  xn(m,n){const x=m[0]*n[0]+m[4]*n[1]+m[8]*n[2],y=m[1]*n[0]+m[5]*n[1]+m[9]*n[2],z=m[2]*n[0]+m[6]*n[1]+m[10]*n[2],l=Math.hypot(x,y,z)||1;return[x/l,y/l,z/l]}
};
let rs=11;function rnd(){rs=(rs*16807)%2147483647;return(rs-1)/2147483646}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function hex(h,k=1){const n=parseInt(h.slice(1),16);return[((n>>16)/255)**2.2*k,((n>>8&255)/255)**2.2*k,((n&255)/255)**2.2*k]}

// ================= Texture atlas: every sign, sticker, product drawn with Canvas 2D =================
const ASW=2048,ASH=4096;const atlasCanvas=document.createElement('canvas');atlasCanvas.width=ASW;atlasCanvas.height=ASH;
const AX=atlasCanvas.getContext('2d');AX.fillStyle='#fff';AX.fillRect(0,0,ASW,ASH);
const FONT='"Helvetica Neue","Arial","Segoe UI",Roboto,sans-serif';
const R={};let packX=2,packY=2,packH=0;
function alloc(name,w,h,fn){if(packX+w+2>ASW){packX=2;packY+=packH+4;packH=0}const x=packX,y=packY;packX+=w+4;packH=Math.max(packH,h);
  if(y+h>ASH)console.warn('atlas full',name);
  AX.save();AX.translate(x,y);AX.beginPath();AX.rect(0,0,w,h);AX.clip();fn(AX,w,h);AX.restore();
  R[name]=[(x+.5)/ASW,(y+.5)/ASH,(x+w-.5)/ASW,(y+h-.5)/ASH];return R[name]}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function txt(c,s,x,y,size,col,wt=800,al='center'){c.font=wt+' '+size+'px '+FONT;c.fillStyle=col;c.textAlign=al;c.textBaseline='middle';c.fillText(s,x,y)}
function fitTxt(c,s,x,y,size,maxW,col,wt=800,al='center'){c.font=wt+' '+size+'px '+FONT;const w=c.measureText(s).width;if(w>maxW)size*=maxW/w;txt(c,s,x,y,size,col,wt,al)}
function shade(h,p){let n=parseInt(h.slice(1),16),r=(n>>16)+p,g=(n>>8&255)+p,b=(n&255)+p;const k=v=>Math.max(0,Math.min(255,v));return'rgb('+k(r)+','+k(g)+','+k(b)+')'}
const CK_RED='#e4211b',CK_ORG='#f7941d',CK_DARK='#b3150f';
// white disc + red K (the round Circle K mark)
function ckLogo(c,cx,cy,r,bg='#fff',k=CK_RED){c.fillStyle=bg;c.beginPath();c.arc(cx,cy,r,0,7);c.fill();
  const s=r*.78;c.fillStyle=k;c.fillRect(cx-s*.5,cy-s*.6,s*.26,s*1.2);
  c.beginPath();c.moveTo(cx-s*.2,cy+s*.02);c.lineTo(cx+s*.34,cy-s*.6);c.lineTo(cx+s*.68,cy-s*.6);c.lineTo(cx+s*.04,cy+s*.08);c.closePath();c.fill();
  c.beginPath();c.moveTo(cx-s*.06,cy-s*.1);c.lineTo(cx+s*.7,cy+s*.6);c.lineTo(cx+s*.34,cy+s*.6);c.lineTo(cx-s*.24,cy+s*.08);c.closePath();c.fill()}
function redPanel(c,w,h){const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#f2352b');g.addColorStop(1,'#d91a14');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.fillStyle=CK_ORG;c.fillRect(0,h*.8,w,h*.1);c.fillStyle='#fff';c.fillRect(0,h*.9,w,h*.1)}
const PACK=['#e8402f','#f2b705','#2a7de1','#1fa35a','#f07c1b','#d93a8c','#ffffff','#7a3fc0','#13a3b5','#c8102e','#ffd23f','#3d5afe','#ff6f61','#00a676','#f4f1de','#e94f37','#393e41','#44bba4'];
function products(c,w,h,rows,o={}){const rh=h/rows;c.fillStyle=o.bg||'#ece9e2';c.fillRect(0,0,w,h);
  for(let r=0;r<rows;r++){const y0=r*rh;c.fillStyle=o.back||'#d9d5cc';c.fillRect(0,y0,w,rh);let x=2;
    while(x<w-4){const iw=(o.small?7:10)+rnd()*(o.small?10:22),ih=rh*(.42+rnd()*.42),col=pick(o.pal||PACK),n=1+Math.floor(rnd()*3);
      for(let k=0;k<n&&x<w-4;k++){const yy=y0+rh-8-ih;const g=c.createLinearGradient(x,0,x+iw,0);g.addColorStop(0,shade(col,-20));g.addColorStop(.45,shade(col,25));g.addColorStop(1,shade(col,-35));c.fillStyle=g;
        if(o.bottles&&rnd()<.75){rr(c,x+1,yy,iw-2,ih,iw*.3);c.fill();c.fillStyle=shade(col,-50);c.fillRect(x+iw*.3,yy-5,iw*.4,6);c.fillStyle='rgba(255,255,255,.85)';c.fillRect(x+2,yy+ih*.35,iw-4,ih*.28);c.fillStyle=pick(PACK);c.fillRect(x+3,yy+ih*.42,iw-6,ih*.07)}
        else{c.fillRect(x,yy,iw-1.5,ih);c.fillStyle='rgba(255,255,255,'+(.45+rnd()*.5)+')';c.fillRect(x+2,yy+ih*(.18+rnd()*.3),iw-5,ih*.16);c.fillStyle=pick(PACK);c.fillRect(x+2,yy+ih*.62,iw-5,ih*.1)}
        x+=iw}x+=1+rnd()*3}
    c.fillStyle='#f4f4f0';c.fillRect(0,y0+rh-8,w,8);for(let px=5;px<w;px+=30+rnd()*18){c.fillStyle=rnd()<.3?'#ffe14d':'#fff';c.fillRect(px,y0+rh-7,16,6);c.fillStyle=CK_RED;c.fillRect(px+2,y0+rh-5,7,2)}
    c.fillStyle='rgba(0,0,0,.28)';c.fillRect(0,y0+rh-9,w,1.5)}}
function poster(name,bg,draw){alloc(name,200,280,(c,w,h)=>{c.fillStyle=bg;c.fillRect(0,0,w,h);draw(c,w,h);c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=6;c.strokeRect(3,3,w-6,h-6)})}
function cup(c,x,y,w,h,col,lid='#fff'){c.fillStyle=col;c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y);c.lineTo(x+w*.85,y+h);c.lineTo(x+w*.15,y+h);c.closePath();c.fill();c.fillStyle=lid;c.fillRect(x-4,y-8,w+8,10)}
function bowl(c,x,y,r,col,food){c.fillStyle=food;c.beginPath();c.ellipse(x,y,r,r*.35,0,0,7);c.fill();c.fillStyle=col;c.beginPath();c.moveTo(x-r,y);c.quadraticCurveTo(x,y+r*1.3,x+r,y);c.closePath();c.fill()}

alloc('white',6,6,(c,w,h)=>{c.fillStyle='#fff';c.fillRect(0,0,w,h)});
// --- fascia (3-panel Circle K storefront) ---
alloc('ckPanel',512,128,(c,w,h)=>redPanel(c,w,h));
alloc('ckCenter',1024,200,(c,w,h)=>{redPanel(c,w,h);txt(c,'CIRCLE',w*.43,h*.42,118,'#fff',900);ckLogo(c,w*.82,h*.42,70)});
alloc('ckVert',160,320,(c,w,h)=>{c.fillStyle='#fff';c.fillRect(0,0,w,h);c.fillStyle=CK_RED;c.fillRect(0,0,w,h*.62);ckLogo(c,w/2,h*.3,58);
  c.fillStyle=CK_ORG;c.fillRect(0,h*.62,w,h*.08);txt(c,'CỬA HÀNG',w/2,h*.78,22,'#333',800);txt(c,'TIỆN LỢI',w/2,h*.88,22,'#333',800)});
alloc('logoDisc',256,256,(c,w,h)=>{c.fillStyle=CK_RED;c.fillRect(0,0,w,h);ckLogo(c,128,128,110)});
alloc('glassBand',1024,48,(c,w,h)=>{c.fillStyle=CK_RED;c.fillRect(0,0,w,h);c.fillStyle='#fff';c.fillRect(0,0,w,3);c.fillRect(0,h-3,w,3);
  for(let x=20;x<w;x+=256){txt(c,'CIRCLE',x+60,h/2,24,'#fff',900);ckLogo(c,x+138,h/2,15);txt(c,'24hrs',x+196,h/2,20,'#fff',700)}});
alloc('welcome',768,110,(c,w,h)=>{c.fillStyle=CK_RED;c.fillRect(0,0,w,h);txt(c,'CIRCLE K KÍNH CHÀO QUÝ KHÁCH',w/2,44,40,'#fff',800);txt(c,'WELCOME',w/2,86,28,'#fff',600)});
alloc('beverage',768,90,(c,w,h)=>{c.fillStyle=CK_RED;c.fillRect(0,0,w,h);c.fillStyle=CK_ORG;c.fillRect(0,h-12,w,12);txt(c,'THỨC UỐNG  ·  BEVERAGE',w/2,h/2-4,44,'#fff',800)});
// --- window posters ---
poster('pMi','#ffd400',(c,w,h)=>{txt(c,'MÌ LY',w/2,48,52,CK_RED,900);cup(c,55,90,90,100,'#fff');c.fillStyle=CK_RED;c.fillRect(62,120,76,30);txt(c,'NÓNG',w/2,135,20,'#fff');
  c.fillStyle=CK_RED;c.beginPath();c.arc(150,215,40,0,7);c.fill();txt(c,'10K',150,215,30,'#fff',900);txt(c,'chỉ từ',60,225,22,'#7a1a00',700)});
poster('pTra','#f6d7c3',(c,w,h)=>{txt(c,'TRÀ SỮA',w/2,44,42,'#6b3a1f',900);txt(c,'trân châu',w/2,80,24,'#6b3a1f',600);cup(c,62,105,76,120,'#b07a4f','#f2e8dc');
  c.fillStyle='#3a1f10';for(let i=0;i<9;i++){c.beginPath();c.arc(72+i*7%56,205-(i%3)*8,5,0,7);c.fill()}txt(c,'22K',w/2,255,36,CK_RED,900)});
poster('p247',CK_RED,(c,w,h)=>{ckLogo(c,w/2,74,52);txt(c,'MỞ CỬA',w/2,160,40,'#fff',900);txt(c,'24/7',w/2,215,72,'#ffe14d',900)});
poster('pCom','#1d8f4e',(c,w,h)=>{txt(c,'CƠM NẮM',w/2,44,40,'#fff',900);c.fillStyle='#fff';c.beginPath();c.moveTo(100,80);c.lineTo(160,190);c.lineTo(40,190);c.closePath();c.fill();
  c.fillStyle='#111';c.fillRect(75,150,50,40);txt(c,'15K',w/2,240,48,'#ffe14d',900)});
poster('pCombo','#0e3a7a',(c,w,h)=>{txt(c,'COMBO SÁNG',w/2,40,30,'#ffe14d',900);c.fillStyle='#d9a25b';rr(c,25,80,110,48,22);c.fill();c.fillStyle='#7a3b10';c.fillRect(40,95,80,6);
  cup(c,130,82,48,70,'#5a2d10');txt(c,'Bánh mì + Cà phê',w/2,185,22,'#fff',700);txt(c,'25K',w/2,235,52,'#fff',900)});
poster('pFrost','#28b6e8',(c,w,h)=>{txt(c,'Trì Độ Mát',w/2,30,24,'#ffe14d',900);cup(c,58,70,84,150,'#14a35a','#fff');c.fillStyle='#e8346c';c.beginPath();c.ellipse(100,72,52,32,0,0,7);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(100,150,22,0,7);c.fill();txt(c,'F',100,151,28,'#14a35a',900);txt(c,'FROSTER',w/2,250,34,'#fff',900)});
poster('pWifi','#ffffff',(c,w,h)=>{c.strokeStyle=CK_RED;c.lineWidth=12;for(let i=0;i<3;i++){c.beginPath();c.arc(w/2,150,30+i*28,-2.4,-.74);c.stroke()}
  c.fillStyle=CK_RED;c.beginPath();c.arc(w/2,150,10,0,7);c.fill();txt(c,'WIFI',w/2,200,44,CK_RED,900);txt(c,'miễn phí',w/2,240,26,'#333',700)});
poster('pLau','#fff4d6',(c,w,h)=>{c.fillStyle=CK_RED;c.fillRect(0,0,w,64);txt(c,'LẨU LY',w/2,34,44,'#ffe14d',900);bowl(c,100,140,62,'#fff','#e8541c');
  c.fillStyle='#2f8a3a';for(let i=0;i<5;i++)c.fillRect(60+i*18,120,8,14);txt(c,'Nóng hổi!',w/2,206,26,CK_RED,800);txt(c,'19.000đ',w/2,246,34,'#222',900)});
poster('pMiTron','#f8b52a',(c,w,h)=>{txt(c,'MÌ TRỘN',w/2,40,40,'#7a1500',900);bowl(c,100,140,64,'#fff','#d9902e');c.strokeStyle='#a86a1a';c.lineWidth=3;
  for(let i=0;i<8;i++){c.beginPath();c.moveTo(50+i*12,128);c.quadraticCurveTo(70+i*10,150,60+i*12,140);c.stroke()}txt(c,'25K',w/2,240,48,CK_RED,900)});

// ================= Procedural mesh builder =================
// vertex: pos3 nrm3 uv2 col3 mat4(rough,metal,emis,kind+16*wet) = 15 floats
const VS=15;
// kinds: 0 std · 1 glass · 2 asphalt · 3 sidewalk tile · 4 indoor tile · 5 painted wall · 6 road paint · 7 neon flicker · 8 foliage · 9 concrete · 11 brushed metal
function Mat(col,o={}){return{c:typeof col==='string'?hex(col):col,r:o.r??.6,m:o.m??0,e:o.e??0,k:o.k??0,w:o.w??0,t:o.t||'white'}}
class Mesh{
  constructor(){this.v=[];this.i=[];this.st=[M4.ident()]}
  get M(){return this.st[this.st.length-1]}
  push(m){this.st.push(M4.mul(this.M,m));return this}
  pop(){this.st.pop();return this}
  at(x,y,z,ry,fn){this.push(ry?M4.mul(M4.trans(x,y,z),M4.rotY(ry)):M4.trans(x,y,z));fn();this.pop()}
  vert(p,n,u,v,mt){const P=M4.xf(this.M,p),N=M4.xn(this.M,n);this.v.push(P[0],P[1],P[2],N[0],N[1],N[2],u,v,mt.c[0],mt.c[1],mt.c[2],mt.r,mt.m,mt.e,mt.k+(mt.w?16:0));return this.v.length/VS-1}
  // a,b,c,d counter-clockwise seen from the front; a = bottom-left
  quad(a,b,c,d,mt,uvr){const e1=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],e2=[d[0]-a[0],d[1]-a[1],d[2]-a[2]];
    let n=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];const l=Math.hypot(...n)||1;n=n.map(x=>x/l);
    const r=uvr||R[mt.t]||R.white;const i0=this.vert(a,n,r[0],r[3],mt);this.vert(b,n,r[2],r[3],mt);this.vert(c,n,r[2],r[1],mt);this.vert(d,n,r[0],r[1],mt);
    this.i.push(i0,i0+1,i0+2,i0,i0+2,i0+3)}
  // faces: {px,nx,py,ny,pz,nz}: atlas name | false (skip) ; default = mat texture
  box(x0,y0,z0,x1,y1,z1,mt,f={}){const T=k=>f[k]===false?null:(Array.isArray(f[k])?f[k]:(f[k]?R[f[k]]:null));const q=(k,a,b,c,d)=>{if(f[k]===false)return;this.quad(a,b,c,d,mt,T(k))};
    q('pz',[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]);q('nz',[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]);
    q('px',[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]);q('nx',[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]);
    q('py',[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]);q('ny',[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1])}
  // centred box helper
  cbox(cx,cy,cz,w,h,d,mt,f){this.box(cx-w/2,cy-h/2,cz-d/2,cx+w/2,cy+h/2,cz+d/2,mt,f)}
  // cylinder / cone along +y from local origin; capTex maps a disc onto the caps
  cyl(r,h,seg,mt,o={}){const r2=o.r2??r,W=R.white,i0=this.v.length/VS;const sl=Math.atan2(r-r2,h);
    for(let s=0;s<=seg;s++){const a=s/seg*Math.PI*2,c=Math.cos(a),sn=Math.sin(a),n=[c*Math.cos(sl),Math.sin(sl),sn*Math.cos(sl)];
      this.vert([c*r,0,sn*r],n,W[0],W[1],mt);this.vert([c*r2,h,sn*r2],n,W[0],W[1],mt)}
    for(let s=0;s<seg;s++){const a=i0+s*2;this.i.push(a,a+1,a+3,a,a+3,a+2)}
    if(o.caps!==false)for(const top of [0,1]){if(o.caps==='top'&&!top)continue;const y=top?h:0,rr_=top?r2:r,n=[0,top?1:-1,0],t=R[o.capTex||mt.t]||W;
      const cu=(t[0]+t[2])/2,cv=(t[1]+t[3])/2,hu=(t[2]-t[0])/2,hv=(t[3]-t[1])/2,c0=this.vert([0,y,0],n,cu,cv,mt);
      for(let s=0;s<=seg;s++){const a=s/seg*Math.PI*2;this.vert([Math.cos(a)*rr_,y,Math.sin(a)*rr_],n,cu+Math.cos(a)*hu*(top?1:-1),cv-Math.sin(a)*hv,mt)}
      for(let s=0;s<seg;s++)top?this.i.push(c0,c0+2+s,c0+1+s):this.i.push(c0,c0+1+s,c0+2+s)}}
  sphere(cx,cy,cz,rx,ry,rz,seg,mt,jit=0){const i0=this.v.length/VS,W=R.white,rows=Math.max(3,seg>>1);
    for(let y=0;y<=rows;y++){const th=y/rows*Math.PI;for(let x=0;x<=seg;x++){const ph=x/seg*Math.PI*2;let nx=Math.sin(th)*Math.cos(ph),ny=Math.cos(th),nz=Math.sin(th)*Math.sin(ph);
      const j=jit?1+(rnd()-.5)*jit:1;const n=[nx/rx,ny/ry,nz/rz],l=Math.hypot(...n);this.vert([cx+nx*rx*j,cy+ny*ry*j,cz+nz*rz*j],[n[0]/l,n[1]/l,n[2]/l],W[0],W[1],mt)}}
    for(let y=0;y<rows;y++)for(let x=0;x<seg;x++){const a=i0+y*(seg+1)+x,b=a+seg+1;this.i.push(a,a+1,b+1,a,b+1,b)}}
