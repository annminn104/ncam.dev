packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # Strapi (apps/strapi): native bindings + postinstall scripts of its dependency tree.
  '@swc/core': true
  better-sqlite3: true
  core-js-pure: true
  sharp: true
# Security overrides: pin patched transitive versions (GitHub Dependabot / pnpm audit).
# - h3: force the SSE-injection / request-smuggling / path-traversal-patched h3 v2
#   (rc.16 -> rc.25). Safe as a global override because removing `vinxi` eliminated the
#   only h3 v1 consumers, so the whole tree is on h3 v2 now. We do NOT bump
#   @tanstack/start-server-core itself: its only patched release (1.167.30) is incompatible
#   with the pinned 1.167.x Start family (the "#tanstack-start-plugin-adapters" import moved),
#   which breaks the SSR build.
overrides:
  h3: '2.0.1-rc.25'
  # start-server-core pulls h3 under the alias `h3-v2: npm:h3@...`, so it needs its own
  # override entry — a plain `h3` override does not reach an aliased dependency.
  h3-v2: 'npm:h3@2.0.1-rc.25'
  # High-severity advisories in transitive deps (`pnpm audit --audit-level high` gates CI).
  # Each override is scoped to the affected major so unrelated majors keep their own range.
  'js-yaml@4': '4.3.2' # GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh (commitlint, tanstack start)
  'nanoid@3': '3.3.18' # GHSA-2v37-7h3g-55p8 (postcss via vite / vitest)
  'brace-expansion@5': '5.0.9' # GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895 (eslint / minimatch)
  'browserslist@4': '4.28.9' # GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g (babel, tanstack start)
  'fast-uri@3': '3.1.7' # GHSA-v2hh-gcrm-f6hx … GHSA-jqff-g426-hqxp (commitlint)
  'undici@7': '7.29.1' # GHSA-4cwx-7wf7-3272 (@module-federation/dts-plugin)
  adm-zip: '0.6.1' # GHSA-xcpc-8h2w-3j85, GHSA-vwc7-r8mq-g2x9 (@module-federation/dts-plugin)
  'sharp@0.35': '0.35.4' # GHSA-rgj7-g3m4-5g8c (@strapi/upload)
  'nodemailer@9': '9.1.1' # GHSA-2x7j-588g-ccc2, GHSA-8m3c-c648-2xjj (@strapi/provider-email-sendmail)
  'qs@6': '6.16.0' # GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx (@strapi/* pin 6.15.3; koa via co-body / formidable)
  # Strapi pins vite 5.4.21 for its admin build, and the 5.x line no longer receives these
  # fixes (all land in 6.4.x). @vitejs/plugin-react-swc 3.11 accepts vite ^6, and
  # `strapi build` + `strapi start` were smoke-tested on 6.4.3. Scoped with `parent>child`
  # so it only rewrites @strapi/strapi's own dependency: a bare `vite@5` selector also
  # matched the root plugins' `^5 || ^6 || …` peer ranges and detached them from vite 8.
  # Brings esbuild ^0.25 (GHSA-67mh-4wv8-2f99) along.
  '@strapi/strapi>vite': '6.4.3' # GHSA-4w7w-66w2-5vf9, GHSA-v6wh-96g9-6wx3, GHSA-fx2h-pf6j-xcff


# Moderate advisories left open on purpose (`pnpm audit --audit-level high` gates CI, so
# they do not block). Dismiss the matching Dependabot alerts with the same reasoning:
# - react-router 6.30.x (Strapi admin via react-router-dom 6): GHSA-wrjc-x8rr-h8h6 and
#   GHSA-337j-9hxr-rhxg are fixed only in 7.18, which Strapi 5 does not support. The admin is
#   a CSR app (no SSR hydration path) behind an authenticated session. Waits on Strapi.
# - stream-json 1.9.1 (@strapi/data-transfer): GHSA-528h-pc64-c93x is in the path filters
#   (pick / ignore / filter / replace); data-transfer only uses jsonl/Parser and
#   jsonl/Stringer. The patched 3.x line is ESM-only (node >= 22) — not a drop-in override.
