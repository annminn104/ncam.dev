# Backstop for keeping the Render-hosted Strapi CMS awake, and an alarm when it
# is unhealthy. The CMS is kept awake by an external uptime monitor that
# requests /api/health every 5 minutes (docs/deployment.md, "Keeping the free
# service awake"); this workflow covers that monitor lapsing.
#
# A free Render web service sleeps after 15 minutes without inbound traffic and
# needs ~60 s to wake. The portfolio host allows the CMS 2.5 s on the home page
# and 5 s in @ncam/cms, so the first request after a sleep always loses: /blog
# falls back to its empty state and the home section shows placeholders.
#
# QUOTA. Render grants 750 Free instance hours per WORKSPACE per calendar month,
# and a service consumes them only while awake. Keeping one service up around
# the clock costs ~744 h in a 31-day month, which leaves ~6 h of headroom for
# everything else. Adding a second always-on free web service would blow the
# quota and Render suspends *every* free service until the next month. If more
# free services appear, keep only one of them awake.
#
# RELIABILITY. GitHub's scheduled workflows are best-effort: the */10 schedule
# below was delivered every 3-6 h here on 2026-09-26/27, which is why it cannot
# be the keep-awake on its own. Each run makes one health check, with retries
# long enough to ride out a cold start, and fails when the CMS does not pass it,
# so GitHub's failure email flags a sick CMS even if nobody watches the monitor.
#
# WHAT IS PINGED. /api/health is the CMS's own route (apps/strapi/src/api/health):
# 200 when the database answers a `select 1`, 503 when it does not. Strapi's
# built-in /_health only proves the process is up; Render's deploy health check
# (render.yaml) still uses that one.
#
# GitHub also disables scheduled workflows after 60 days without repository
# activity; re-enable it in the Actions tab if the repo goes quiet.

name: Keep CMS awake

on:
  schedule:
    # Every 10 minutes — inside Render's 15-minute idle window with room for drift.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Least privilege: this job only makes an outbound request.
permissions:
  contents: read

# A delayed run must not stack on top of the next one.
concurrency:
  group: keep-cms-awake
  cancel-in-progress: false

jobs:
  ping:
    name: Check the CMS health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No actions are used on purpose: nothing needs checking out, and a plain
      # `run` step keeps this free of third-party SHAs to pin and review.
      - name: Check /api/health
        env:
          # Override with a repository variable if the CMS moves.
          CMS_URL: ${{ vars.CMS_URL || 'https://ncam-cms.onrender.com' }}
        run: |
          set -uo pipefail
          # One request. --max-time and the retries cover a ~60 s cold start,
          # which Render answers by holding the request until the service is up.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors \
                   "${CMS_URL}/api/health" || echo "000")
          echo "GET ${CMS_URL}/api/health: HTTP ${code}"
          # 200 means the CMS is awake and its database answers; a 503 woke the
          # service, but its database did not answer.
          case "$code" in
            2*|3*) ;;
            *)
              echo "::error::CMS failed its health check (HTTP ${code}) — it may be suspended, redeploying, out of Render free instance hours, or unable to reach its database."
              exit 1
              ;;
          esac
