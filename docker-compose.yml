name: ncam

# One image (built once by the `portfolio` service) is reused by every service;
# each service just runs a different command. Bring the stack up with:
#   docker compose up --build
#
# Every remote runs in the portfolio container's network namespace
# (`network_mode: service:portfolio`), so the host reaches each one on
# `localhost:<port>`, the same URL the browser uses through the ports the
# portfolio service publishes. That is what lets the host fetch a remote's
# `remoteEntry.ssr.js` and server-render it: @module-federation/vite fetches SSR
# entries over plain http only from a loopback host, so per-container hostnames
# (`toonhub.localhost` and the like) would leave every remote client-only.
# The host bakes these entry URLs at BUILD time: the Dockerfile's defaults.
#
# Opt-in gateway (nginx reverse proxy):
#   docker compose --profile gateway up --build
# It fronts the SSR host on port 80 (http://localhost, http://ncam.localhost) and
# proxies each remote on its *.localhost subdomain (see nginx/nginx.conf). A host
# rebuilt with those port-80 remote URLs, e.g.
# TOONHUB_REMOTE_URL=http://toonhub.localhost/remoteEntry.js, loads the remotes
# through the gateway, but on the client only, for the reason above.

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: '22'
    image: ncam-monorepo:latest
    command: ['node', 'apps/portfolio/.output/server/index.mjs']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '9000'
      # The host evaluates each remote's SSR entry with vm.SourceTextModule, as
      # on Vercel. Without the flag the loader writes the entry to disk instead,
      # where it cannot resolve the host's packages, and every remote falls back
      # to a client mount.
      NODE_OPTIONS: --experimental-vm-modules
      # Blog CMS (runtime; see .env). Needs the `cms` profile up — otherwise the
      # host renders placeholders / an empty blog instead of failing.
      STRAPI_URL: http://strapi:1337
      STRAPI_PUBLIC_URL: http://cms.localhost:1337
    # The remotes share this container's network namespace, so their ports are
    # published here too. They start after the host (they need its namespace);
    # a remote still booting is mounted on the client until it answers.
    ports:
      - '9000:9000'
      - '9001:9001'
      - '9002:9002'
      - '9003:9003'
      - '9004:9004'
      - '9005:9005'
      - '9006:9006'
      - '9007:9007'

  toonhub:
    image: ncam-monorepo:latest
    command: ['pnpm', '--filter', '@ncam/toonhub', 'preview', '--host', '0.0.0.0', '--port', '9001']
    network_mode: service:portfolio

  mindloop:
    image: ncam-monorepo:latest
    command:
      ['pnpm', '--filter', '@ncam/mindloop', 'preview', '--host', '0.0.0.0', '--port', '9002']
    network_mode: service:portfolio

  immersive-ocean:
    image: ncam-monorepo:latest
    command:
      [
        'pnpm',
        '--filter',
        '@ncam/immersive-ocean',
        'preview',
        '--host',
        '0.0.0.0',
        '--port',
        '9003',
      ]
    network_mode: service:portfolio

  viktor:
    image: ncam-monorepo:latest
    command: ['pnpm', '--filter', '@ncam/viktor', 'preview', '--host', '0.0.0.0', '--port', '9004']
    network_mode: service:portfolio

  bali:
    image: ncam-monorepo:latest
    command: ['pnpm', '--filter', '@ncam/bali', 'preview', '--host', '0.0.0.0', '--port', '9005']
    network_mode: service:portfolio

  profile:
    image: ncam-monorepo:latest
    command: ['pnpm', '--filter', '@ncam/profile', 'preview', '--host', '0.0.0.0', '--port', '9006']
    network_mode: service:portfolio

  holodex:
    image: ncam-monorepo:latest
    command: ['pnpm', '--filter', '@ncam/holodex', 'preview', '--host', '0.0.0.0', '--port', '9007']
    network_mode: service:portfolio

  # ── CMS (Strapi): own image + Postgres, in the `cms` profile so the default
  # `docker compose up` (frontend stack) never needs apps/strapi/.env.
  # First run: `pnpm --filter @ncam/strapi setup:env` (secrets + DB password).
  # Then: `docker compose up --build strapi` (naming the service activates the
  # profile; strapi-db comes along) → http://localhost:1337/admin
  # With the gateway: `docker compose --profile gateway --profile cms up --build`
  # → http://cms.localhost
  strapi:
    profiles: ['cms']
    build:
      context: .
      dockerfile: apps/strapi/Dockerfile
      args:
        NODE_VERSION: '22'
    image: ncam-strapi:latest
    env_file:
      - path: apps/strapi/.env # secrets, DB credentials, PUBLIC_URL — never committed
        required: false
    environment: # compose-specific values win over env_file
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '1337'
      DATABASE_CLIENT: postgres
      DATABASE_HOST: strapi-db
      DATABASE_PORT: '5432'
    ports:
      - '1337:1337'
    volumes:
      - strapi-uploads:/app/public/uploads
    depends_on:
      strapi-db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - cms.localhost
    restart: unless-stopped

  strapi-db:
    profiles: ['cms']
    image: postgres:16-alpine
    env_file:
      - path: apps/strapi/.env # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
        required: false
    volumes:
      - strapi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Optional reverse proxy — only runs with `--profile gateway` ──────────
  gateway:
    profiles: ['gateway']
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
    depends_on:
      - portfolio
      - toonhub
      - mindloop
      - immersive-ocean
      - viktor
      - bali
      - profile
      - holodex
    networks:
      default:
        aliases:
          - ncam.localhost

volumes:
  strapi-uploads:
  strapi-db-data:
